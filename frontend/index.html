<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f2">
  <meta name="description" content="websocket_chat_go，一个让对话更有温度的即时通讯空间。">
  <title>websocket_chat_go</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 1 1 19 0Z"/><path d="M7 10h10M7 14h6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M16 4a4 4 0 0 1 0 8M18 15a6 6 0 0 1 4 6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.1"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10M10 21h4"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14a4 4 0 0 0 8 0M8 9h.1M16 9h.1"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2a4 4 0 0 1 6 0M5 16l9-9"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 5 5 3-3 4 4"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m8 3 8 0-1 7 4 4H5l4-4-1-7ZM12 14v7"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3c-13-2-18 10-11 14 7 5 13-5 11-14ZM4 21 16 9"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20 4a5 5 0 0 0-8 2 5 5 0 0 0-8-2c-6 6 8 16 8 16S26 10 20 4Z"/></symbol>
  </svg>
  <section class="auth-screen" id="auth-screen" aria-label="账号注册与登录">
    <div class="auth-panel">
      <div class="auth-brand"><span class="auth-logo">☀</span><div><strong>websocket_chat_go</strong><span>简单、可靠的即时通讯</span></div></div>
      <div class="auth-copy"><p class="eyebrow">WELCOME BACK</p><h1 id="auth-title">登录账号</h1><p id="auth-subtitle">使用邮箱和密码继续聊天。</p></div>
      <form class="auth-form" id="auth-form" novalidate>
        <label class="form-label" for="auth-email">邮箱地址</label>
        <input class="form-input auth-input" id="auth-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254" required>
        <label class="form-label" for="auth-password">密码</label>
        <div class="password-field"><input class="form-input auth-input" id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" minlength="8" maxlength="72" required><button class="password-toggle" id="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
        <label class="form-label auth-name-label" for="auth-name" hidden>昵称</label>
        <input class="form-input auth-input auth-name-input" id="auth-name" name="name" type="text" autocomplete="name" placeholder="请输入昵称" maxlength="30" hidden>
        <label class="form-label auth-confirm-label" for="auth-password-confirm" hidden>确认密码</label>
        <input class="form-input auth-input auth-confirm-input" id="auth-password-confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="请再次输入密码" minlength="8" maxlength="72" hidden>
        <p class="auth-error" id="auth-error" role="alert" hidden></p>
        <button class="dialog-submit auth-submit" id="auth-submit" type="submit">登录</button>
      </form>
      <p class="auth-switch" id="auth-switch-text">还没有账号？<button type="button" id="auth-switch">立即注册</button></p>
      <p class="auth-note">当前为前端演示，账号信息只保存在本浏览器中。</p>
    </div>
  </section>
  <div class="workspace" id="workspace" hidden>
    <nav class="rail" aria-label="主导航">
      <a class="brand" href="./index.html" aria-label="websocket_chat_go首页"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 24a12 12 0 1 1 23-5c0 7-5 13-13 13H7l3-6"/><path d="M15 19h.1M25 19h.1M16 24c2 2 6 2 8 0"/></svg></a>
      <button class="rail-button active" data-view="chats" aria-label="消息" aria-pressed="true"><svg class="icon"><use href="#i-chat"/></svg><span>消息</span><i class="rail-dot" id="nav-unread"></i></button>
      <button class="rail-button" data-view="contacts" aria-label="联系人" aria-pressed="false"><svg class="icon"><use href="#i-users"/></svg><span>联系人</span></button>
      <button class="rail-button" data-view="groups" aria-label="群组" aria-pressed="false"><svg class="icon"><use href="#i-grid"/></svg><span>群组</span></button>
      <div class="rail-bottom"><button class="rail-button" id="settings-button" aria-label="设置"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></button><button class="self-avatar" id="profile-button" aria-label="编辑个人资料">余<span class="presence"></span></button></div>
    </nav>
    <aside class="conversation-pane" aria-label="会话与联系人">
      <div class="pane-heading"><h1 id="pane-title">消息</h1><button class="add-button" id="new-button" aria-label="发起聊天"><svg class="icon"><use href="#i-plus"/></svg></button></div>
      <label class="search-box"><svg class="icon"><use href="#i-search"/></svg><input id="list-search" type="search" placeholder="搜索联系人或会话" autocomplete="off" maxlength="100" aria-label="搜索会话或联系人"><kbd>⌘ K</kbd></label>
      <div class="list-tabs" id="list-tabs" role="group" aria-label="筛选会话"><button class="active" data-filter="all" aria-pressed="true">全部<span id="total-count">6</span></button><button data-filter="unread" aria-pressed="false">未读<span id="unread-count">2</span></button><button data-filter="group" aria-pressed="false">群聊</button></div>
      <div class="conversation-list" id="conversation-list"></div>
    </aside>
    <main class="chat-pane" aria-label="聊天窗口">
      <header class="chat-header"><button class="icon-button mobile-back" id="back-button" aria-label="返回会话列表"><svg class="icon"><use href="#i-arrow"/></svg></button><div id="chat-avatar"></div><div class="chat-heading"><h2 id="chat-title">一起去看日落</h2><p id="chat-subtitle">4 位成员 · 3 位在线（演示）</p></div><div class="chat-header-actions"><button class="icon-button" id="message-search-button" aria-label="搜索当前聊天记录"><svg class="icon"><use href="#i-search"/></svg></button><button class="icon-button" id="more-button" aria-label="更多会话操作" aria-expanded="false"><svg class="icon"><use href="#i-more"/></svg></button></div><div class="dropdown" id="conversation-menu" hidden></div></header>
      <div class="message-search" id="message-search" hidden><svg class="icon"><use href="#i-search"/></svg><input type="search" id="message-query" aria-label="搜索当前聊天记录" placeholder="在当前会话中查找…" maxlength="100"><span id="message-match-count"></span><button class="icon-button" id="close-message-search" aria-label="关闭聊天记录搜索"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <section class="message-stream" id="message-stream" aria-label="消息记录" role="log" aria-live="polite" aria-relevant="additions"></section>
      <form class="composer" id="composer"><div class="attachment-preview" id="attachment-preview" hidden></div><label class="visually-hidden" for="message-input">输入消息</label><textarea id="message-input" placeholder="输入消息…" rows="2" maxlength="4000"></textarea>
        <div class="composer-bottom"><div class="composer-tools"><button class="icon-button" type="button" id="emoji-button" aria-label="选择表情" aria-expanded="false"><svg class="icon"><use href="#i-smile"/></svg></button><button class="icon-button" type="button" id="image-button" aria-label="添加图片"><svg class="icon"><use href="#i-image"/></svg></button><button class="icon-button" type="button" id="file-button" aria-label="添加文件"><svg class="icon"><use href="#i-paperclip"/></svg></button><span class="composer-separator"></span><span class="composer-hint" id="send-hint">Enter 发送 · Shift + Enter 换行</span></div><button class="send-button" id="send-button" type="submit" disabled>发送<svg class="icon"><use href="#i-send"/></svg></button></div>
        <div class="emoji-picker" id="emoji-picker" role="group" aria-label="表情选择" hidden></div><input id="attachment-input" type="file" hidden>
      </form>
    </main>
  </div>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><div><p class="eyebrow" id="dialog-eyebrow">MAKE A CONNECTION</p><h2 id="dialog-title">开启新对话</h2></div><button class="icon-button" id="dialog-close" aria-label="关闭弹窗"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="dialog-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div><noscript><p class="noscript">websocket_chat_go需要开启 JavaScript 才能使用本地演示交互。</p></noscript>
</body>
</html>
